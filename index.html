
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Angry Birds Halloween Adventure</title>

    <script src="https://unpkg.com/@ruffle-rs/ruffle"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #111;
        }

        #gameContainer {
            display: flex;
            flex-direction: column;
            width: 100%;
            height: 100%;
        }

        #gameArea {
            position: relative;
            flex: 1;
            min-height: 0;
            width: 100%;
        }

        ruffle-player {
            display: block;
            width: 100%;
            height: 100%;
        }

        #gameEmbed {
            display: block;
            width: 100%;
            height: 100%;
        }

        /* CONTROLES MÓVILES */

        #mobileControls {
            display: none;
            position: fixed;
            bottom: 10px;
            left: 0;
            width: 100%;
            z-index: 9999;
            padding: 0 18px;
            justify-content: space-between;
            align-items: center;
            pointer-events: none;
            touch-action: none;
        }

        #directionControls {
            display: grid;
            grid-template-columns: repeat(3, 48px);
            grid-template-rows: repeat(2, 44px);
            gap: 5px;
            pointer-events: auto;
        }

        .arrowButton {
            border: 1px solid #999;
            border-radius: 8px;
            background: rgba(45, 45, 45, 0.85);
            color: white;
            font-size: 23px;
            font-weight: bold;
            touch-action: none;
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        .arrowButton:active,
        .arrowButton.pressed {
            background: #777;
            transform: scale(0.95);
        }

        #upButton {
            grid-column: 2;
            grid-row: 1;
        }

        #leftButton {
            grid-column: 1;
            grid-row: 2;
        }

        #downButton {
            grid-column: 2;
            grid-row: 2;
        }

        #rightButton {
            grid-column: 3;
            grid-row: 2;
        }

        #spaceButton {
            width: 125px;
            height: 45px;
            border: 1px solid #d5a329;
            border-radius: 8px;
            background: rgba(247, 203, 77, 0.92);
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.22);
            color: #222;
            font-family: Arial, sans-serif;
            font-size: 13px;
            font-weight: bold;
            letter-spacing: 1px;
            pointer-events: auto;
            touch-action: none;
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        #spaceButton:active,
        #spaceButton.pressed {
            background: #e8b82f;
            transform: translateY(1px);
        }

        @media (hover: none) and (pointer: coarse) {
            #mobileControls {
                display: flex;
            }
        }
    </style>
</head>

<body>

    <div id="gameContainer">

        <div id="gameArea">
            <embed
                src="angry-birds-halloween-adventure.swf"
                id="gameEmbed"
                width="100%"
                height="100%">
        </div>

        <div id="mobileControls">

            <div id="directionControls">
                <button type="button" class="arrowButton" id="upButton">▲</button>
                <button type="button" class="arrowButton" id="leftButton">◀</button>
                <button type="button" class="arrowButton" id="downButton">▼</button>
                <button type="button" class="arrowButton" id="rightButton">▶</button>
            </div>

            <button type="button" id="spaceButton">
                ␣ &nbsp; SPACE
            </button>

        </div>

    </div>

    <script>
        const activeKeys = new Set();

        const keys = {
            up:     { key: "ArrowUp",    code: "ArrowUp",    keyCode: 38 },
            down:   { key: "ArrowDown",  code: "ArrowDown",  keyCode: 40 },
            left:   { key: "ArrowLeft",  code: "ArrowLeft",  keyCode: 37 },
            right:  { key: "ArrowRight", code: "ArrowRight", keyCode: 39 },
            space:  { key: " ",          code: "Space",      keyCode: 32 }
        };

        // OBTENER EL REPRODUCTOR RUFFLE
        function getPlayer() {
            return document.querySelector("ruffle-player");
        }

        // ENVIAR TECLAS A RUFFLE
        function sendKey(type, keyInfo) {
            const player = getPlayer();

            if (!player) {
                console.warn("No se encontró el reproductor Ruffle.");
                return;
            }

            player.focus();

            // ACTIVAR EL ENFOQUE DE ENTRADA
            if (type === "keydown") {
                player.dispatchEvent(new PointerEvent("pointerdown", {
                    bubbles: true,
                    composed: true,
                    cancelable: true,
                    pointerType: "touch",
                    isPrimary: true,
                    button: 0,
                    buttons: 1
                }));
            }

            // ENVIAR EVENTO DE TECLADO
            player.dispatchEvent(new KeyboardEvent(type, {
                key: keyInfo.key,
                code: keyInfo.code,
                keyCode: keyInfo.keyCode,
                which: keyInfo.keyCode,
                bubbles: true,
                cancelable: true,
                composed: true,
                view: window
            }));
        }

        // PRESIONAR TECLA
        function pressKey(name) {
            if (activeKeys.has(name)) return;

            activeKeys.add(name);

            const button = document.getElementById(
                name === "space" ? "spaceButton" : name + "Button"
            );

            if (button) button.classList.add("pressed");

            sendKey("keydown", keys[name]);
        }

        // SOLTAR TECLA
        function releaseKey(name) {
            if (!activeKeys.has(name)) return;

            activeKeys.delete(name);

            const button = document.getElementById(
                name === "space" ? "spaceButton" : name + "Button"
            );

            if (button) button.classList.remove("pressed");

            sendKey("keyup", keys[name]);
        }

        // EVITAR DESPLAZAMIENTO DE LA PÁGINA
        document.addEventListener("keydown", function(event) {
            if (
                event.code.startsWith("Arrow") ||
                event.code === "Space"
            ) {
                event.preventDefault();
            }
        });

        // CONFIGURAR BOTONES TÁCTILES
        function setupButton(buttonId, keyName) {
            const button = document.getElementById(buttonId);

            button.addEventListener("pointerdown", function(event) {
                event.preventDefault();

                if (button.setPointerCapture) {
                    button.setPointerCapture(event.pointerId);
                }

                pressKey(keyName);
            });

            button.addEventListener("pointerup", function(event) {
                event.preventDefault();
                releaseKey(keyName);
            });

            button.addEventListener("pointercancel", function() {
                releaseKey(keyName);
            });

            button.addEventListener("lostpointercapture", function() {
                releaseKey(keyName);
            });
        }

        setupButton("upButton", "up");
        setupButton("downButton", "down");
        setupButton("leftButton", "left");
        setupButton("rightButton", "right");
        setupButton("spaceButton", "space");

        // LIBERAR TODAS LAS TECLAS
        function releaseAllKeys() {
            [...activeKeys].forEach(releaseKey);
        }

        window.addEventListener("blur", releaseAllKeys);

        document.addEventListener("visibilitychange", function() {
            if (document.hidden) releaseAllKeys();
        });

    </script>

</body>
</html>
